# 初赛正式配置：训练与评分目录隔离，评分期只允许按起点读取当前及历史观测。
extends: default.yaml

project:
  name: gas_power_preliminary

paths:
  root: ".."
  data: "data/preliminary/train"
  scoring_data: "data/preliminary/scoring"

competition_compliance:
  stage: preliminary
  offline_only: true
  official_data_only: true
  allow_external_pretrained_weights: false
  restricted_path_keys: [scoring_data]
  allowed_commands: [audit-data, benchmark, discover-relations, backtest, doctor, train, tune, validate, predict, run]
  training_period: ["2025-01-01 00:00:00", "2025-05-01 00:00:00"]
  scoring_period: ["2025-05-01 00:00:00", "2025-05-02 23:45:00"]
  note: "Pre 文件中的 2025-05-01 00:00:00 是官方提供的滚动预测参考时刻；评分标签不得进入训练、调参或模型选择，预测期仅按起点及之前的观测历史构造因果输入。"
  scoring_history_points: 672

data:
  tables:
    gas:
      path: "Pre_gas.csv"
    gas_holder:
      path: "Pre_gas_holder.csv"
      mappings:
        blast_furnace_gas_holder_1:
          sources: []
          patterns: ["^blast_furnace_gas_holder_\\d+$"]
          combine: sum
          required: true
        coke_oven_gas_holder_1:
          required: false
        converter_gas_holder_1:
          required: false
    gas_user:
      path: "Pre_gas_user.csv"
      mappings:
        coke_oven_user1:
          required: false
    load:
      path: "Pre_load.csv"
    price:
      path: "price.xlsx"
      time_series: false
    audit_scenarios:
      required: false

# 初赛提交采用 7 天历史 Hampel 检测；全部统计只使用参考时刻以前的数据。
preprocessing:
  imputation:
    method: ffill
    limit: null
  outliers:
    enabled: true
    method: hampel
    window: 672
    min_periods: 96
    mad_multiplier: 6.0
    replace_with: median

features:
  lag_steps: [1, 2, 3, 4, 5, 6, 7, 8, 12, 16, 24, 32, 48, 96, 192, 288, 672]
  rolling_windows: [4, 8, 16, 32, 96]
  holder_momentum_enabled: true
  gas_load_mismatch:
    enabled: true
    windows: [4, 8, 16]
    minimum_load_mw: 1.0

forecast:
  short_steps: 8
  model:
    type: last_value
    clip_min: null
    components: []
  prediction_origins:
    mode: scoring
    count: null
    file: null
# 只使用训练期滚动验证进行模型决策；8 折覆盖不同月份和生产阶段。
validation:
  mode: expanding
  folds: 8
  initial_train_points: 3840
  validation_points: 192
  step_points: 1056
  rolling_train_points: 3840

recent_validation:
  # 复核阶段保留 8 个近期折，最终逐列门控从中均匀选取 4 折。
  folds: 8
  validation_points: 192
  step_points: 192
  rolling_train_points: null

# 正式高分档；快速调试请使用 official_preliminary_fast.yaml。
optuna:
  # 25 分钟搜索上限为完整复核、8 折评分和提交生成预留时间。
  n_trials: 10
  n_startup_trials: 6
  top_k: 4
  coarse_folds: 2
  timeout_seconds: 1500
  strategy: mixed
  n_estimators_min: 150
  n_estimators_max: 750
  n_estimators_step: 150
  direct_n_estimators_max: 450
  catboost_iterations_min: 75
  catboost_iterations_max: 225
  catboost_iterations_step: 75
  direct_catboost_iterations_max: 150

model_selection:
  recent_folds: 3
  cross_month_folds: 3
  # 14:13 线上高分版的三个主力试验作为不可缺失的验证基线。
  incumbent_trial_numbers: [7, 4, 3]
  # 10%/25% 时序 Mixup 双留出消融均未达到稳定提分门槛，正式运行不增加该候选。
  fixed_challengers: []
  candidate_gate:
    recent_minimum_mean_gain: 0.001
    recent_minimum_improved_folds: 3
    recent_maximum_worst_degradation: 0.015
    cross_month_minimum_mean_gain: 0.0
    cross_month_minimum_improved_folds: 2
    cross_month_maximum_worst_degradation: 0.015
  minimum_non_degraded_folds: 4
  maximum_worst_degradation: 0.015
  fold_group_weights:
    recent_: 3.0
    cross_month_: 1.0
  regime_specialist:
    enabled: false
    online_threshold_mw: 1.0
    stable_delta_threshold_mw: 2.0
    minimum_samples: 96
    # 高风险冲榜：弱收缩并允许少量月份退化，最终仍需通过相对最后值门控。
    shrinkage: 32.0
    minimum_mean_gain: 0.0
    minimum_non_degraded_folds: 2
    maximum_worst_degradation: 0.03
  # 高风险冲榜：每个目标和步长仅保留训练期 OOF 最优模型，并用留一折结果门控。
  hard_router:
    enabled: false
    minimum_mean_gain: 0.0
    minimum_non_degraded_folds: 2
    maximum_worst_degradation: 0.03
  baseline_candidates:
    - {name: damped_trend, type: damped_trend, window: 5, damping: 0.85}
    - {name: daily_naive, type: seasonal_naive, period_steps: 96}
    - {name: daily_median_3, type: seasonal_median, period_steps: 96, seasons: 3}
  hourly_calibration:
    enabled: false
    hour_bin_size: 4
    minimum_samples: 24
    shrinkage: 48
    minimum_factor: 0.90
    maximum_factor: 1.10
    minimum_non_degraded_folds: 4
    maximum_worst_degradation: 0.005

submission:
  stage: preliminary
  archive_name: "咕咕嘎嘎_gas_predict_prelim.zip"
  quality_normalization:
    enabled: true
    drop_constant_columns: true
    drop_duplicate_columns: true
    iqr_multiplier: 1.5
    clip_iqr_multiplier: 1.0
    iqr_interpolations: [linear, lower, higher, midpoint, nearest]
    zscore_threshold: 3.0
    max_iqr_passes: 10

# 评分期文件只作为逐起点预测输入，不读取未来标签或计算本地测试成绩。
prediction_input:
  table_paths:
    gas: "Pre_test_gas.csv"
    gas_holder: "Pre_test_gas_holder.csv"
    gas_user: "Pre_test_gas_user.csv"
    load: "Pre_test_load.csv"
