[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-power-forecast-optimization"
version = "0.1.0"
description = "煤气发电量预测与发电优化竞赛工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.2,<2",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<4",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "threadpoolctl>=3.1,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0,<5"]
catboost = ["catboost>=1.2,<2"]
optuna = ["optuna>=3.6,<5"]
high-accuracy = ["lightgbm>=4.0,<5", "catboost>=1.2,<2", "optuna>=3.6,<5"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<7"]

[project.scripts]
gas-power = "gas_power.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
